name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            exe: ''
          - os: windows-2025
            exe: '.exe'
          - os: macos-15
            exe: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      PYTHONUTF8: 1
    steps:
      - name: Preserve fixture line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
          rustc --version
          cargo --version
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install native build and display dependencies
        if: runner.os == 'Linux'
        run: |
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev xvfb xauth weston imagemagick ffmpeg lsof libgl1-mesa-dri libegl1 libwayland-egl1 libxkbcommon-x11-0 libgl1 libx11-xcb1 libxcursor1 libxi6 libxrandr2
      - name: Check documentation and package metadata
        run: |
          python tools/verify-doc-twins.py
          python tools/verify-version.py
          python tools/check-project-artifacts.py
          python -I tools/verify-editor-texture-cache.py --self-test
          python -I tools/verify-editor-native-preview.py --self-test
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Build shared core, CLI, editor and test targets
        shell: bash
        run: ./tools/build-rust-core.sh --locked --all-targets --features gui
      - name: Run Rust tests including GUI and doc tests
        run: cargo test --locked --offline --manifest-path rust/Cargo.toml --target-dir out/rust --features gui --no-fail-fast
      - name: Verify the reusable four-color CMO3 fixture
        run: |
          cargo test --locked --offline --manifest-path rust/Cargo.toml --target-dir out/rust --features gui --example four-color-cmo3
          cargo test --locked --offline --manifest-path rust/Cargo.toml --target-dir out/rust --features gui --test core a_pro_size_cmo3_large_textures_render_and_roundtrip -- --ignored --exact
          python -I tools/verify-four-color-fixture.py \
            --example ./out/rust/debug/examples/four-color-cmo3${{ matrix.exe }} --out "$RUNNER_TEMP/four-color-fixture"
      - name: Upload four-color fixture verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-color-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/four-color-fixture/run-*/result.json
          if-no-files-found: warn
          retention-days: 3
      - name: Verify real video encoding, audio timing and decoding
        if: runner.os == 'Linux'
        run: cargo test --locked --offline --manifest-path rust/Cargo.toml --target-dir out/rust --features gui --test export real_ffmpeg -- --ignored
      - name: Check the command manifest and editor dispatch
        run: |
          ./tools/verify-command-manifest.sh
          git diff --exit-code -- doc/commands.manifest.json
      - name: Verify core FFI, CLI and MCP behavior
        run: python tools/verify-rust-core.py
      - name: Verify MCP stdio initialization
        run: python tools/verify-mcp-initialize.py ./out/rust/debug/soul2d-core${{ matrix.exe }} --mcp
      - name: Verify scripted HTTP MCP editing and persistence
        env:
          INOCHI_CONFIG_PATH: ${{ runner.temp }}/scripted-mcp-config
        run: |
          python -I tools/verify-acp-agent.py \
            --core ./out/rust/debug/soul2d-core${{ matrix.exe }} \
            --njc ./out/rust/debug/njc${{ matrix.exe }} \
            --families nodes-inspector,history,session \
            --no-agent --out "$RUNNER_TEMP/scripted-mcp"
      - name: Upload scripted HTTP MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-mcp-${{ matrix.os }}
          path: ${{ runner.temp }}/scripted-mcp/run-*.json
          if-no-files-found: warn
          retention-days: 3
      - name: Verify Image scalar controls over HTTP MCP
        if: runner.os == 'Linux'
        env:
          INOCHI_CONFIG_PATH: ${{ runner.temp }}/image-controls-config
        run: python -I tools/verify-can3-image-controls.py --core ./out/rust/debug/soul2d-core --njc ./out/rust/debug/njc
      - name: Upload Image scalar control evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: can3-image-controls
          path: build/verification/can3-image-controls/mcp-*
          if-no-files-found: warn
          retention-days: 3
      - name: Verify physics source edits and first-group creation over HTTP MCP
        if: runner.os == 'Linux'
        env:
          INOCHI_CONFIG_PATH: ${{ runner.temp }}/physics-source-config
        run: python -I tools/verify-physics3-edit.py --core ./out/rust/debug/soul2d-core --njc ./out/rust/debug/njc
      - name: Upload physics source verification result
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: physics-source
          path: build/verification/ani236/mcp-*/result.json
          if-no-files-found: warn
          retention-days: 3
      - name: Verify Texture Viewer replacement in a production X11 window
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python -I tools/verify-editor-texture-cache.py \
            --editor ./out/rust/debug/soul2d-editor --out "$RUNNER_TEMP/editor-texture-cache"
      - name: Upload Texture Viewer window evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-texture-cache
          path: |
            ${{ runner.temp }}/editor-texture-cache/**/*.json
            ${{ runner.temp }}/editor-texture-cache/**/*.jsonl
            ${{ runner.temp }}/editor-texture-cache/**/*.log
            ${{ runner.temp }}/editor-texture-cache/**/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Verify native CMO3 preview in a production X11 window
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            python -I tools/verify-editor-native-preview.py \
            --editor ./out/rust/debug/soul2d-editor --example ./out/rust/debug/examples/four-color-cmo3 \
            --out "$RUNNER_TEMP/editor-native-preview"
      - name: Upload native CMO3 preview window evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: editor-native-preview
          path: |
            ${{ runner.temp }}/editor-native-preview/**/*.json
            ${{ runner.temp }}/editor-native-preview/**/*.jsonl
            ${{ runner.temp }}/editor-native-preview/**/*.log
            ${{ runner.temp }}/editor-native-preview/**/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Launch the editor on X11 and Wayland
        if: runner.os == 'Linux'
        run: ./tools/verify-linux-launch.sh "$RUNNER_TEMP/linux-launch"
      - name: Upload editor launch evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-launch
          path: ${{ runner.temp }}/linux-launch
          if-no-files-found: ignore
          retention-days: 3
