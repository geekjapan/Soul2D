name: Packaging

# Builds the Flatpak and the Windows MSI from build-aux/ and smoke-tests the result. Kept apart from
# rust-core.yml so the main build stays fast. Nothing is signed or published; the artifacts expire after 3 days.
# The filters list what the packages are assembled from. rust/src is left out on purpose: rust-core.yml compiles
# it on every change, and a Flatpak and an MSI build per source change is not worth the runner time. Start this
# workflow by hand (workflow_dispatch) before a release.
on:
  push:
    branches: [main]
    paths:
      - 'build-aux/**'
      - 'tools/**'
      - 'rust/Cargo.*'
      - 'tl/**'
      - 'gentl.sh'
      - 'res/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
      - 'doc/licenses/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    branches: [main]
    paths:
      - 'build-aux/**'
      - 'tools/**'
      - 'rust/Cargo.*'
      - 'tl/**'
      - 'gentl.sh'
      - 'res/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
      - 'doc/licenses/**'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.geekjapan.soul2d

jobs:
  # The editor loads *.mo catalogues from beside the executable; the MSI packages them from out/i18n.
  # msgfmt is not available on the Windows runner, so compile them once here (see gentl.sh).
  translations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile translations
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          ./gentl.sh
          ls -l out/*.mo
      - uses: actions/upload-artifact@v4
        with:
          name: translations
          path: out/*.mo
          retention-days: 1

  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Keep the recommends: flatpak-builder needs appstream-compose for the metainfo step.
          sudo apt-get install -y flatpak flatpak-builder dbus-daemon
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs to start a sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak --version
          flatpak-builder --version
      - name: Add the Flathub remote
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Vendor the Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          # The Flatpak build sandbox has no network, so the manifest builds from these vendored crates
          # (build-aux/linux/flatpak/nightly/cargo-vendor-config.toml points Cargo at them).
          cargo vendor --locked --manifest-path rust/Cargo.toml build-aux/linux/flatpak/nightly/vendor > /dev/null
      - name: Build the Flatpak
        shell: bash
        run: |
          set -euo pipefail
          # The state, build and repo directories sit in out/, which the manifest's source skips: the
          # manifest copies the whole repository root into the build.
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --default-branch=nightly --state-dir=out/flatpak-state --repo=out/flatpak-repo \
            out/flatpak-build "build-aux/linux/flatpak/nightly/${APP_ID}.yml"
      - name: Export the bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            out/flatpak-repo out/soul2d-nightly.flatpak "$APP_ID" nightly
          ls -l out/soul2d-nightly.flatpak
      - name: Install the bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive --bundle out/soul2d-nightly.flatpak
          flatpak info --user "$APP_ID"
      - name: Check the installed files
        shell: bash
        run: |
          set -euo pipefail
          # The runner has no session bus; give flatpak one.
          run() { dbus-run-session -- flatpak run --command="$1" "$APP_ID" "${@:2}"; }
          for f in soul2d soul2d-core njc; do run test -x "/app/bin/$f"; done
          # The same set as tools/copy-notices.sh.
          for f in LICENSE NotoSans-Regular-LICENSE NotoSansCJK-Regular-LICENSE OpenDyslexic-LICENSE \
            epaint_default_fonts-LICENSES.txt THIRD_PARTY.md rust-dependencies.tsv rust-dependencies-licenses.txt; do
            run test -s "/app/share/licenses/$APP_ID/$f"
          done
          for f in da de_DE 'de_DE@formal' es it ja ko zh-CN zh-TW; do run test -s "/app/bin/$f.mo"; done
          run test -s "/app/share/icons/hicolor/256x256/apps/$APP_ID.png"
          run test -s "/app/share/applications/$APP_ID.desktop"
          run test -s "/app/share/metainfo/$APP_ID.metainfo.xml"
      - name: Smoke-test soul2d-core --mcp in the sandbox
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- python3 tools/verify-mcp-initialize.py flatpak run --command=soul2d-core "$APP_ID" --mcp

  wix:
    needs: translations
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download translations
        uses: actions/download-artifact@v4
        with:
          name: translations
          path: out/i18n
      - name: Fetch locked Rust dependencies
        shell: bash
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Compile Windows resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # rc.exe lives in the Windows SDK; load the Visual Studio developer environment to find it.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -prerelease -legacy -latest -property installationPath
          $command = Join-Path $installationPath "Common7\Tools\vsdevcmd.bat"
          & "${env:COMSPEC}" /s /c "`"$command`" -no_logo && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }
          New-Item -ItemType Directory -Force out | Out-Null
          # Icon and version information, linked into the executables by the next step.
          rc /nologo /c65001 /fo "$env:GITHUB_WORKSPACE\out\soul2d.res" build-aux\windows\soul2d.rc
          if ($LASTEXITCODE -ne 0) { throw "rc failed with exit code $LASTEXITCODE" }
      - name: Build the release binaries
        shell: bash
        env:
          # Static CRT: no Visual C++ redistributable is needed. The .res file carries icon and version info.
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=${{ github.workspace }}\out\soul2d.res
        run: |
          set -euo pipefail
          ./tools/build-rust-core.sh --locked --release --features gui
          ls -l out/rust/release/soul2d-editor.exe out/rust/release/soul2d-core.exe out/rust/release/njc.exe
      - name: Build the MSI with WiX 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # WiX Toolset 3.14 is preinstalled on the runner image; the WIX variable points at its folder.
          $wix = if ($env:WIX) { $env:WIX } else { "${env:ProgramFiles(x86)}\WiX Toolset v3.14\" }
          $bin = Join-Path $wix 'bin'
          if (-not (Test-Path (Join-Path $bin 'candle.exe'))) { throw "WiX 3 not found in $bin" }
          # Product.wxs paths are relative to build-aux\windows\wix (res\ and ..\..\..\out\...).
          Push-Location build-aux\windows\wix
          New-Item -ItemType Directory -Force obj | Out-Null
          & (Join-Path $bin 'candle.exe') -nologo -arch x64 -ext WixUIExtension -out obj\ Product.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }
          # -sval skips ICE validation, which needs the Windows Installer service and often fails on CI runners.
          & (Join-Path $bin 'light.exe') -nologo -sval -ext WixUIExtension -cultures:en-us -out ..\..\..\out\Soul2D.msi obj\Product.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }
          Pop-Location
          Get-Item out\Soul2D.msi | Format-List Name, Length
      - name: Validate the MSI by administrative extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path out\Soul2D.msi).Path
          $target = Join-Path $env:RUNNER_TEMP 'msi-admin'
          $log = Join-Path $env:RUNNER_TEMP 'msi-admin.log'
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"", '/l*v', "`"$log`"")
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 80
            throw "msiexec /a failed with exit code $($proc.ExitCode)"
          }
          # The same notice set as tools/copy-notices.sh, plus the three executables and the catalogues. Paths are
          # relative to the folder soul2d.exe lands in: the editor reads the catalogues from i18n beside it.
          $expected = @('soul2d.exe', 'soul2d-core.exe', 'njc.exe',
            'LICENSE', 'NotoSans-Regular-LICENSE', 'NotoSansCJK-Regular-LICENSE', 'OpenDyslexic-LICENSE',
            'epaint_default_fonts-LICENSES.txt', 'THIRD_PARTY.md', 'rust-dependencies.tsv', 'rust-dependencies-licenses.txt',
            'i18n\da.mo', 'i18n\de_DE.mo', 'i18n\de_DE@formal.mo', 'i18n\es.mo', 'i18n\it.mo', 'i18n\ja.mo',
            'i18n\ko.mo', 'i18n\zh-CN.mo', 'i18n\zh-TW.mo')
          $files = Get-ChildItem -Path $target -Recurse -File
          $files | ForEach-Object { $_.FullName.Substring($target.Length) } | Sort-Object
          $app = ($files | Where-Object { $_.Name -eq 'soul2d.exe' } | Select-Object -First 1).DirectoryName
          if (-not $app) { throw 'soul2d.exe is missing from the MSI' }
          $missing = $expected | Where-Object {
            $item = Get-Item -LiteralPath (Join-Path $app $_) -ErrorAction SilentlyContinue
            -not ($item -and $item.Length -gt 0)
          }
          if ($missing) { throw "missing from the MSI: $($missing -join ', ')" }
          python tools/verify-mcp-initialize.py (Join-Path $app 'soul2d-core.exe') --mcp
          if ($LASTEXITCODE -ne 0) { throw "soul2d-core.exe --mcp did not answer initialize" }
      - name: Generate the owned INX installation fixture
        shell: bash
        run: python tools/verify-rust-core.py --fixture-only
      - name: Verify the installed Windows product
        shell: pwsh
        run: |
          ./tools/verify-windows-install.ps1 -Msi out/Soul2D.msi `
            -Fixture out/rust-verification/fixture.inx `
            -EvidenceDirectory "$env:RUNNER_TEMP/windows-install"
      - name: Upload Windows installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install
          path: ${{ runner.temp }}/windows-install
          if-no-files-found: warn
          retention-days: 3
